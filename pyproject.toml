[project]
name = "accordion-ergonomics-core"
version = "0.1.0"
description = "Reproducible 3D research into chromatic button accordion ergonomics"
readme = "README.md"
authors = [
    { name = "Sheng-Han (Aysh) Su", email = "13860646+arthow4n@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "clarabel>=0.11.1",
    "mink>=1.3.0",
    "mujoco>=3.15.0",
    "myo-sim==0.2.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
]

[project.scripts]
aec = "accordion_ergonomics_core.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
