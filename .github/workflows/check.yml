name: research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run aec check
      - name: Headless EGL reproduction
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          uv run aec experiment experiments/001-single-contact/experiment.json
